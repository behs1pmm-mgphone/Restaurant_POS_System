<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Table | Premium POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
	rel="stylesheet">

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<style>
body {
	font-family: 'Plus Jakarta Sans', sans-serif;
	overflow-x: hidden;
}

.no-scrollbar::-webkit-scrollbar {
	display: none;
}

.sidebar-gradient {
	background: linear-gradient(180deg, #1E1B4B 0%, #312E81 100%);
}

.waiter-gradient {
	background: linear-gradient(135deg, #4338CA 0%, #6366F1 100%);
}

/* Sidebar Transitions */
aside {
	transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
	z-index: 50;
}

@media ( max-width : 1280px) {
	aside {
		position: fixed;
		height: 100vh;
		left: -18rem;
	}
	.sidebar-open aside {
		left: 0;
	}
	.sidebar-overlay {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(0, 0, 0, 0.4);
		z-index: 40;
	}
	.sidebar-open .sidebar-overlay {
		display: block;
	}
}

.sidebar-hidden aside {
	margin-left: -18rem;
}

/* Your Original Table Styles */
.table-card {
	transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
	cursor: pointer;
}

.table-available {
	border-top: 4px solid #10B981;
}

.table-occupied {
	border-top: 4px solid #EF4444;
}

.table-booked {
	border-top: 4px solid #F59E0B;
}

.table-maintenance {
	border-top: 4px solid #64748b;
	filter: grayscale(1);
	opacity: 0.6;
	pointer-events: none;
}

.table-disabled {
	border-top: 4px solid #0f172a;
	filter: grayscale(1);
	opacity: 0.4;
	pointer-events: none;
}
</style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">
	<div id="overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

	<div id="mainWrapper" class="flex h-screen overflow-hidden">

		<aside
			class="w-72 sidebar-gradient text-white flex flex-col shadow-2xl shrink-0">
			<div class="p-10 flex flex-col items-center border-b border-white/10">
				<div
					class="w-20 h-20 rounded-[2rem] bg-indigo-500/20 backdrop-blur-md border border-white/20 flex items-center justify-center text-3xl font-black mb-4">
					<span class="text-indigo-300"
						th:text="${session.loginUser != null ? session.loginUser.userName.substring(0,1) : 'W'}">W</span>
				</div>
				<h3 class="font-bold text-lg"
					th:text="${session.loginUser != null ? session.loginUser.userName : 'Waiter Name'}">Waiter
					Name</h3>
				<div
					class="px-3 py-1 bg-indigo-500/20 rounded-full mt-2 border border-indigo-400/30">
					<span
						class="text-[9px] uppercase tracking-widest text-indigo-300 font-black">Staff
						/ Waiter</span>
				</div>
			</div>

			<nav class="flex-1 px-6 py-8 space-y-3 overflow-y-auto no-scrollbar">
				<a th:href="@{/waiter/dashboard}"
					class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group opacity-70">
					<i
					class="fas fa-th-large text-indigo-400/50 group-hover:text-indigo-400"></i>
					Dashboard
				</a> <a th:href="@{/waiter/areas}"
					class="flex items-center gap-4 p-4 bg-white/10 rounded-[1.5rem] font-bold border border-white/5">
					<i class="fas fa-plus-circle text-indigo-400"></i> New Order
				</a> <a th:href="@{/waiter/my-orders}"
					class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group opacity-70">
					<i class="fas fa-clipboard-list text-indigo-400"></i> My Orders
				</a> <a th:href="@{/waiter/order-status}"
					class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group opacity-70">
					<i class="fas fa-list-check text-indigo-400"></i> Order Status
				</a>
			</nav>

			<div class="p-8 border-t border-white/10">
				<a th:href="@{/logout}"
					class="flex items-center justify-center gap-3 p-4 bg-red-500/10 hover:bg-red-500 rounded-2xl transition-all text-red-400 hover:text-white font-bold text-sm">
					<i class="fas fa-power-off"></i> Logout
				</a>
			</div>
		</aside>

		<main class="flex-1 flex flex-col overflow-y-auto">
			<header
				class="h-20 bg-white/80 backdrop-blur-md px-6 lg:px-10 flex justify-between items-center border-b border-slate-200 sticky top-0 z-20 shrink-0">
				<div class="flex items-center gap-5">
					<button id="toggleSidebar"
						class="p-2 hover:bg-slate-100 rounded-xl transition-colors text-slate-500">
						<i class="fas fa-bars text-xl"></i>
					</button>
					<div class="w-1 h-8 waiter-gradient rounded-full"></div>
					<div>
						<h2
							class="font-black text-slate-800 text-lg uppercase leading-none">Select
							Table</h2>
						<p
							class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1"
							th:text="${'Floor: ' + areaName}">Dining Hall</p>
					</div>
				</div>
				<a th:href="@{/waiter/areas}"
					class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200 transition-all">
					<i class="fas fa-arrow-left mr-1 text-slate-400"></i> Switch Area
				</a>
			</header>

			<div class="p-6 lg:p-10">
				<div id="tablesGrid"
					class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
					<div th:each="table : ${tables}"
						th:id="'table-card-' + ${table.tableId}"
						th:classappend="${#strings.toLowerCase(table.status) == 'occupied' ? 'table-occupied' :
                                        (#strings.toLowerCase(table.status) == 'booked' ? 'table-booked' :
                                        (#strings.toLowerCase(table.status) == 'maintenance' ? 'table-maintenance' :
                                        (#strings.toLowerCase(table.status) == 'disabled' ? 'table-disabled' : 'table-available')))}"
						class="table-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-1 text-center relative overflow-hidden border border-slate-100">

						<div class="text-3xl mb-3">
							<i class="fas fa-utensils status-icon"
								th:classappend="${#strings.toLowerCase(table.status) == 'occupied' ? 'text-red-400' :
                                              (#strings.toLowerCase(table.status) == 'booked' ? 'text-amber-400' :
                                              (#strings.toLowerCase(table.status) == 'maintenance' || #strings.toLowerCase(table.status) == 'disabled' ? 'text-slate-400' : 'text-emerald-400'))}"></i>
						</div>

						<h3 class="font-black text-2xl text-slate-800 tracking-tighter"
							th:text="${table.tableNumber}">T-1</h3>

						<p
							class="status-text text-[9px] uppercase tracking-[0.2em] font-black mt-2"
							th:classappend="${#strings.toLowerCase(table.status) == 'occupied' ? 'text-red-500' :
                                          (#strings.toLowerCase(table.status) == 'booked' ? 'text-amber-500' :
                                          (#strings.toLowerCase(table.status) == 'maintenance' || #strings.toLowerCase(table.status) == 'disabled' ? 'text-slate-500' : 'text-emerald-500'))}"
							th:text="${table.status}">Available</p>

						<a th:href="@{/waiter/tables/{id}/open(id=${table.maskedId})}"
							class="action-btn mt-6 block py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all bg-slate-900 text-white hover:bg-emerald-600 shadow-lg shadow-slate-200">
							<span>Open Order</span>
						</a>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script th:inline="javascript">
        // Sidebar Toggle Logic
        function toggleSidebar() {
            const body = document.body;
            const wrapper = document.getElementById('mainWrapper');
            if (window.innerWidth <= 1280) {
                body.classList.toggle('sidebar-open');
            } else {
                wrapper.classList.toggle('sidebar-hidden');
            }
        }
        document.getElementById('toggleSidebar').addEventListener('click', toggleSidebar);

        // Original WebSocket Logic
        var socket = new SockJS('/ws-pos');
        var stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/table-updates', function (message) {
                if (message.body === "REFRESH") {
                    window.location.reload();
                    return;
                }
                var data = JSON.parse(message.body);
                if (data.action === "DELETE") {
                    var card = document.getElementById('table-card-' + data.id);
                    if(card) {
                        card.style.opacity = "0";
                        card.style.transform = "scale(0.8)";
                        setTimeout(() => card.remove(), 400);
                    }
                } else if (data.action === "UPDATE_STATUS" || data.action === "TOGGLE") {
                    updateUI(data.id, data.status);
                } else {
                    window.location.reload();
                }
            });

            stompClient.subscribe('/topic/area-updates', function (msg) {
                const areaData = JSON.parse(msg.body);
                const currentAreaId = /*[[${maskedAreaId}]]*/ '';
                if(areaData.maskedId === currentAreaId) {
                    window.location.href = '/waiter/areas';
                }
            });
        });

        // Original UI update logic
        function updateUI(id, status) {
            var card = document.getElementById('table-card-' + id);
            if (!card) return;

            var icon = card.querySelector('.status-icon');
            var text = card.querySelector('.status-text');
            var btn = card.querySelector('.action-btn');

            card.classList.remove('table-available', 'table-occupied', 'table-booked', 'table-maintenance', 'table-disabled');
            icon.classList.remove('text-emerald-400', 'text-red-400', 'text-amber-400', 'text-slate-400');
            text.classList.remove('text-emerald-500', 'text-red-500', 'text-amber-500', 'text-slate-500');

            const statusLower = status.toLowerCase();

            if (statusLower === 'occupied') {
                card.classList.add('table-occupied');
                icon.classList.add('text-red-400');
                text.classList.add('text-red-500');
                text.innerText = 'Occupied';
                btn.className = 'action-btn mt-6 block py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-400 pointer-events-none';
                btn.innerHTML = '<span>In Service</span>';
            } else if (statusLower === 'booked') {
                card.classList.add('table-booked');
                icon.classList.add('text-amber-400');
                text.classList.add('text-amber-500');
                text.innerText = 'Booked';
                btn.className = 'action-btn mt-6 block py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-slate-900 text-white hover:bg-emerald-600 shadow-lg';
                btn.innerHTML = '<span>Open Order</span>';
            } else if (statusLower === 'maintenance' || statusLower === 'disabled') {
                card.classList.add(statusLower === 'maintenance' ? 'table-maintenance' : 'table-disabled');
                icon.classList.add('text-slate-400');
                text.classList.add('text-slate-500');
                text.innerText = status;
                btn.className = 'action-btn mt-6 block py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-400 pointer-events-none';
                btn.innerHTML = '<span>Locked</span>';
            } else {
                card.classList.add('table-available');
                icon.classList.add('text-emerald-400');
                text.classList.add('text-emerald-500');
                text.innerText = 'Available';
                btn.className = 'action-btn mt-6 block py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-slate-900 text-white hover:bg-emerald-600 shadow-lg';
                btn.innerHTML = '<span>Open Order</span>';
            }
        }
    </script>
</body>
</html>
