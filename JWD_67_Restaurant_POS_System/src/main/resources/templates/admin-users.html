<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management | Premium POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar-gradient { background: linear-gradient(180deg, #064E3B 0%, #065F46 100%); }
        .welcome-gradient { background: linear-gradient(135deg, #064E3B 0%, #059669 100%); }

        /* Sidebar Toggle Logic */
        aside { transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-hidden aside { margin-left: -18rem; }

        /* DataTables Custom Styling */
        .dataTables_wrapper .dataTables_filter { float: right; margin-bottom: 20px; }
        .dataTables_wrapper .dataTables_filter input {
            background: #f1f5f9 !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 12px !important;
            padding: 10px 16px !important;
            outline: none !important;
            width: 250px;
        }

        /* Pagination Alignment Fix */
        .dataTables_wrapper .dataTables_paginate {
            float: none !important;
            margin-top: 30px !important;
            display: flex !important;
            justify-content: center !important;
            gap: 8px !important;
            width: 100%;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            padding: 10px 18px !important;
            border-radius: 14px !important;
            border: 1px solid #e2e8f0 !important;
            background: white !important;
            font-weight: 700 !important;
            font-size: 13px !important;
            color: #64748b !important;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 2px !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .dataTables_wrapper .dataTables_info {
            float: none !important;
            display: block !important;
            text-align: center !important;
            margin-top: 15px !important;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .dataTables_wrapper::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">
    <div id="dashboardWrapper" class="flex h-screen overflow-hidden">

        <aside class="w-72 sidebar-gradient text-white flex flex-col shadow-2xl relative shrink-0">
            <div class="absolute top-0 left-0 w-32 h-32 bg-white/5 rounded-full -ml-16 -mt-16"></div>
            
            <div class="p-10 flex flex-col items-center relative z-10 border-b border-white/10">
                <div class="w-20 h-20 rounded-[2rem] bg-emerald-500/20 backdrop-blur-md border border-white/20 flex items-center justify-center text-3xl font-black shadow-2xl mb-4 group hover:scale-110 transition-transform cursor-pointer">
                    <span class="text-emerald-400 group-hover:text-white transition-colors"
                          th:text="${session.loginUser != null ? session.loginUser.userName.substring(0,1) : 'M'}">M</span>
                </div>
                <h3 class="font-bold text-lg tracking-tight" th:text="${session.loginUser != null ? session.loginUser.userName : 'Admin'}">Admin</h3>
                <div class="px-3 py-1 bg-emerald-500/10 rounded-full mt-2 border border-emerald-500/20">
                    <span class="text-[9px] uppercase tracking-[0.2em] text-emerald-400 font-black">Administrator</span>
                </div>
            </div>

            <nav class="flex-1 px-6 py-8 space-y-3 overflow-y-auto no-scrollbar relative z-10">
                <a th:href="@{/admin/dashboard}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group opacity-70">
                    <i class="fas fa-home text-emerald-500/50 group-hover:text-emerald-400"></i>
                    <span class="font-semibold">Home</span>
                </a>
                <a th:href="@{/admin/users}" class="flex items-center gap-4 p-4 bg-white/10 rounded-[1.5rem] shadow-inner font-bold border border-white/5">
                    <i class="fas fa-users-cog text-emerald-400"></i>
                    <span>User Management</span>
                </a>
                <a th:href="@{/admin/areas}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group opacity-70">
                    <i class="fas fa-map-marker-alt text-emerald-500/50 group-hover:text-emerald-400"></i>
                    <span class="font-semibold">Area Management</span>
                </a>
                <a th:href="@{/admin/menu}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group">
                    <i class="fas fa-utensils text-emerald-500/50 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-semibold opacity-70 group-hover:opacity-100">Menu Catalog</span>
                </a>
                <a th:href="@{/admin/reports/daily}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group">
                    <i class="fas fa-chart-pie text-emerald-500/50 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-semibold opacity-70 group-hover:opacity-100">Reports</span>
                </a>
            </nav>

            <div class="p-8 border-t border-white/10">
                <a th:href="@{/logout}" class="flex items-center justify-center gap-3 p-4 bg-red-500/10 hover:bg-red-500 rounded-2xl transition-all text-red-400 hover:text-white font-bold text-sm border border-red-500/20">
                    <i class="fas fa-power-off"></i> Logout System
                </a>
            </div>
        </aside>
        
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="h-20 bg-white/80 backdrop-blur-md px-10 flex justify-between items-center border-b border-slate-200 sticky top-0 z-20 shrink-0">
                <div class="flex items-center gap-5">
                    <button id="sidebarToggle" class="p-2 hover:bg-slate-100 rounded-xl transition-colors text-slate-500">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div class="w-1 h-8 welcome-gradient rounded-full"></div>
                    <div>
                        <h2 class="font-black text-slate-800 text-xl tracking-tight uppercase leading-none">User Management</h2>
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.3em] mt-1 opacity-70">Staff Access Levels</p>
                    </div>
                </div>
                <button id="openAddModal" class="bg-emerald-500 text-white px-6 py-3 rounded-2xl font-bold shadow-lg shadow-emerald-500/30 hover:bg-emerald-600 transition-all flex items-center gap-2 text-sm">
                    <i class="fas fa-plus text-xs"></i> Add New User
                </button>
            </header>

            <div class="p-10">
                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-8">
                    <table id="userTable" class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 text-[10px] uppercase tracking-[0.3em] font-black border-b border-slate-50">
                                <th class="pb-6">No.</th>
                                <th class="pb-6">Employee</th>
                                <th class="pb-6">Email Address</th>
                                <th class="pb-6">Role</th>
                                <th class="pb-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr th:each="user, stat : ${users}" class="hover:bg-slate-50/50 transition-all">
                                <td class="py-6 font-extrabold text-slate-800 text-xs" th:text="${stat.index + 1}">01</td>
                                <td class="py-6">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 font-black text-sm"
                                             th:text="${user.userName.substring(0,1)}">U</div>
                                        <span class="font-bold text-slate-700 text-sm" th:text="${user.userName}">Name</span>
                                    </div>
                                </td>
                                <td class="py-6 text-slate-500 text-sm font-medium" th:text="${user.email}">mail@example.com</td>
                                <td class="py-6">
                                    <span class="px-3 py-1 rounded-lg bg-emerald-50 text-emerald-600 font-black text-[10px] uppercase tracking-wider"
                                          th:text="${user.roleId == 1 ? 'Admin' : (user.roleId == 2 ? 'Waiter' : 'Cashier')}">Role</span>
                                </td>
                                <td class="py-6 text-right">
                                    <div class="flex justify-end gap-2">
                                        <button class="edit-user-btn p-2 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded-xl transition-all"
                                                th:data-id="${user.userId}"
                                                th:data-name="${user.userName}"
                                                th:data-email="${user.email}"
                                                th:data-role="${user.roleId}">
                                            <i class="far fa-edit"></i>
                                        </button>
                                        
                                        <button type="button" th:onclick="'confirmDelete(' + ${user.userId} + ')'"
                                           class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all">
                                            <i class="far fa-trash-alt"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="userModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-10 shadow-2xl">
            <h2 class="text-xl font-black mb-6 text-slate-800">Register New Staff</h2>
            <form th:action="@{/admin/users/add}" th:object="${userBean}" method="post" class="space-y-4">
                <input type="text" th:field="*{userName}" placeholder="Full Name" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-emerald-500 text-sm" required>
                <input type="email" th:field="*{email}" placeholder="Email Address" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-emerald-500 text-sm" required>
             <!--  <input type="password" th:field="*{password}" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-emerald-500 text-sm" required> --> 
             
             <input type="text"
       name="password"
       th:value="${userBean.password}"
       placeholder="Password"
       class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-emerald-500 text-sm"
       required>
              
                <select th:field="*{roleId}" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-emerald-500 text-sm font-bold">
                    <option value="1">Administrator</option>
                    <option value="2">Waiter</option>
                    <option value="3">Cashier</option>
                    <option value="4">Kitchen</option>
                </select>
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 bg-emerald-500 text-white p-4 rounded-2xl font-bold text-sm shadow-lg hover:bg-emerald-600 transition-all">Save User</button>
                    <button type="button" class="close-modal bg-slate-100 text-slate-500 px-6 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-all">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Function to handle delete without exposing URL on hover
        function confirmDelete(id) {
            if (confirm('Confirm deletion?')) {
                window.location.href = '/admin/users/delete/' + id;
            }
        }

        // Logic to Open/Close the Modal
        const modal = document.getElementById('userModal');
        const openBtn = document.getElementById('openAddModal');
        const closeBtns = document.querySelectorAll('.close-modal');

        // Show modal when clicking "Add New User"
        openBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        // Hide modal when clicking "Cancel"
        closeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
        });

        // Sidebar Toggle Logic
        const sidebarToggle = document.getElementById('sidebarToggle');
        const dashboardWrapper = document.getElementById('dashboardWrapper');

        sidebarToggle.addEventListener('click', () => {
            dashboardWrapper.classList.toggle('sidebar-hidden');
        });
    </script>
</body> 
</html>
