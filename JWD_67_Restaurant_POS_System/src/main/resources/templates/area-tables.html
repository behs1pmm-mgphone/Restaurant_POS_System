<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tables Management | Premium POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .sidebar-gradient { background: linear-gradient(180deg, #064E3B 0%, #065F46 100%); }
        .header-gradient { background: linear-gradient(135deg, #064E3B 0%, #059669 100%); }

        .table-available { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .table-occupied { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .table-booked { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .table-maintenance { background: linear-gradient(135deg, #64748b 0%, #475569 100%); }
        .table-disabled { background: linear-gradient(135deg, #334155 0%, #0f172a 100%); opacity: 0.8; }

        .modal-overlay { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); }

        .toast-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 100%;
            max-width: 450px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1.5rem;
        }

        .js-alert {
            pointer-events: auto;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes dropDown {
            from { transform: translateY(-150%) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-drop-down { animation: dropDown 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .fade-out-up {
            opacity: 0 !important;
            transform: translateY(-150%) scale(0.9) !important;
            margin-top: -80px !important;
            filter: blur(4px);
        }

        .alert-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 100%;
            transform-origin: left;
            animation: timerLoop 4s linear forwards;
        }
        @keyframes timerLoop { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        aside { transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-hidden aside { margin-left: -18rem; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">

    <div class="toast-container">
        <div th:if="${success}" class="js-alert animate-drop-down bg-white/90 backdrop-blur-xl p-6 rounded-[2rem] flex items-center gap-5 relative overflow-hidden mb-4">
            <div class="w-12 h-12 bg-emerald-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200">
                <i class="fas fa-check text-xl"></i>
            </div>
            <div class="pr-4">
                <p class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-600 mb-0.5">Success</p>
                <p class="font-bold text-slate-800 text-base" th:text="${success}"></p>
            </div>
            <div class="alert-progress bg-emerald-500/30"></div>
        </div>

        <div th:if="${error}" class="js-alert animate-drop-down bg-white/90 backdrop-blur-xl p-6 rounded-[2rem] flex items-center gap-5 relative overflow-hidden mb-4 border-l-4 border-red-500">
            <div class="w-12 h-12 bg-red-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-red-200">
                <i class="fas fa-exclamation-triangle text-xl"></i>
            </div>
            <div class="pr-4">
                <p class="text-[10px] font-black uppercase tracking-[0.2em] text-red-600 mb-0.5">Error</p>
                <p class="font-bold text-slate-800 text-base" th:text="${error}"></p>
            </div>
            <div class="alert-progress bg-red-500/30"></div>
        </div>
    </div>

    <div id="mainWrapper" class="flex h-screen overflow-hidden">
        <aside class="w-72 sidebar-gradient text-white flex flex-col shadow-2xl relative shrink-0">
            <div class="absolute top-0 left-0 w-32 h-32 bg-white/5 rounded-full -ml-16 -mt-16"></div>

            <div class="p-10 flex flex-col items-center relative z-10 border-b border-white/10">
                <div class="w-20 h-20 rounded-[2rem] bg-emerald-500/20 backdrop-blur-md border border-white/20 flex items-center justify-center text-3xl font-black shadow-2xl mb-4 group hover:scale-110 transition-transform cursor-pointer">
                    <span class="text-emerald-400 group-hover:text-white transition-colors" th:text="${session.loginUser != null ? session.loginUser.userName.substring(0,1) : 'A'}">A</span>
                </div>
                <h3 class="font-bold text-lg tracking-tight" th:text="${session.loginUser != null ? session.loginUser.userName : 'Admin'}">Admin Name</h3>
                <div class="px-3 py-1 bg-emerald-500/10 rounded-full mt-2 border border-emerald-500/20">
                    <span class="text-[9px] uppercase tracking-[0.2em] text-emerald-400 font-black">Administrator</span>
                </div>
            </div>

            <nav class="flex-1 px-6 py-8 space-y-3 overflow-y-auto no-scrollbar relative z-10">
                <a th:href="@{/admin/dashboard}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group">
                    <i class="fas fa-home text-emerald-500/50 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-semibold opacity-70 group-hover:opacity-100">Home</span>
                </a>
                <a th:href="@{/admin/users}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group">
                    <i class="fas fa-users-cog text-emerald-500/50 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-semibold opacity-70 group-hover:opacity-100">User Management</span>
                </a>
                <a th:href="@{/admin/areas}" class="flex items-center gap-4 p-4 bg-white/10 rounded-[1.5rem] shadow-inner font-bold border border-white/5 transition-all">
                    <i class="fas fa-map-marker-alt text-emerald-400"></i>
                    <span>Area Management</span>
                </a>
                <a th:href="@{/admin/menu}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group">
                    <i class="fas fa-utensils text-emerald-500/50 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-semibold opacity-70 group-hover:opacity-100">Menu Catalog</span>
                </a>
                <a th:href="@{/admin/reports/daily}" class="flex items-center gap-4 p-4 hover:bg-white/10 rounded-[1.5rem] transition-all group">
                    <i class="fas fa-chart-pie text-emerald-500/50 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-semibold opacity-70 group-hover:opacity-100">Reports</span>
                </a>
            </nav>

            <div class="p-8 border-t border-white/10">
                <a th:href="@{/logout}" class="flex items-center justify-center gap-3 p-4 bg-red-500/10 hover:bg-red-500 rounded-2xl transition-all text-red-400 hover:text-white font-bold text-sm border border-red-500/20">
                    <i class="fas fa-power-off"></i> Logout System
                </a>
            </div>
        </aside>
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="h-20 bg-white/80 backdrop-blur-md px-10 flex justify-between items-center border-b border-slate-200 sticky top-0 z-20 shrink-0">
                <div class="flex items-center gap-5">
                    <button id="sidebarToggle" class="p-2 hover:bg-slate-100 rounded-xl transition-colors text-slate-500">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div class="w-1 h-8 header-gradient rounded-full shadow-sm"></div>
                    <div>
                        <h2 class="font-black text-slate-800 text-xl tracking-tight uppercase leading-none" th:text="${areaName}">Main Dining Area</h2>
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.3em] mt-1 opacity-70">Table Layout Control</p>
                    </div>
                </div>
            </header>

            <div class="p-10 space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-6">
                    <a th:href="@{/admin/areas}" class="inline-flex items-center gap-4 px-8 py-4 bg-emerald-600 text-white rounded-[2rem] font-black text-[11px] hover:bg-emerald-700 transition-all active:scale-95 group uppercase tracking-[0.25em]">
                        <i class="fas fa-chevron-left group-hover:-translate-x-2 transition-transform"></i>
                        Return to Floor Plan
                    </a>
                    <button onclick="openAddTableModal()" class="bg-slate-900 text-white font-black px-8 py-4 rounded-2xl hover:bg-emerald-600 shadow-lg transition-all active:scale-95 flex items-center gap-3">
                        <i class="fas fa-plus text-xs"></i> Add New Table
                    </button>
                </div>

                <div id="tablesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-6">
                    <div th:each="table : ${tables}"
                         th:id="'table-card-' + ${table.tableId}"
                         th:class="'group h-40 rounded-[2.5rem] flex flex-col items-center justify-center text-white font-bold cursor-pointer transition-all hover:-translate-y-2 hover:shadow-2xl relative overflow-hidden ' +
                                    (${#strings.toLowerCase(table.status)} == 'available' ? 'table-available' :
                                    (${#strings.toLowerCase(table.status)} == 'occupied' ? 'table-occupied' :
                                    (${#strings.toLowerCase(table.status)} == 'maintenance' ? 'table-maintenance' :
                                    (${#strings.toLowerCase(table.status)} == 'disabled' ? 'table-disabled' : 'table-booked'))))"
                         th:data-id="${table.maskedId}"
                         th:data-number="${table.tableNumber}"
                         onclick="openTableModal(this)">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-white/10 rounded-full -mr-10 -mt-10"></div>
                        <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center mb-3 backdrop-blur-md">
                            <i class="fas fa-utensils text-xl"></i>
                        </div>
                        <span class="text-xl font-black tracking-tighter" th:text="${table.tableNumber}">T-1</span>
                        <div class="status-badge mt-2 px-4 py-1 bg-black/10 rounded-full text-[9px] uppercase tracking-[0.15em] font-black" th:text="${table.status}">Available</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="addTableModal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white w-[26rem] p-10 rounded-[3.5rem] shadow-2xl transform scale-90 transition-all duration-300" id="addTableContent">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-[2rem] flex items-center justify-center mx-auto mb-4 border border-emerald-100">
                    <i class="fas fa-plus text-3xl"></i>
                </div>
                <h3 class="text-3xl font-black text-slate-800">New Table</h3>
            </div>
            <form th:action="@{/admin/tables/add}" method="post" class="space-y-6">
                <input type="hidden" name="input_area_id" th:value="${maskedAreaId}" />
                <input type="text" name="table_number" placeholder="e.g 101" class="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 w-full focus:border-emerald-500 outline-none font-bold" required />
                <div class="flex gap-3">
                    <button type="button" onclick="closeAddTableModal()" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-xs uppercase">Cancel</button>
                    <button type="submit" class="flex-[2] bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-emerald-600">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div id="tableModal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white w-[26rem] p-10 rounded-[3.5rem] shadow-2xl transform scale-90 transition-all duration-300" id="modalContent">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-slate-50 text-emerald-600 rounded-[2rem] flex items-center justify-center mx-auto mb-4 border border-slate-100">
                    <i class="fas fa-edit text-3xl"></i>
                </div>
                <h3 id="modalTitle" class="text-3xl font-black text-slate-800">Table Info</h3>
            </div>
            <div class="space-y-3">
                <a id="availLink" href="#" class="flex items-center justify-between bg-emerald-50 text-emerald-700 p-5 rounded-2xl font-black hover:bg-emerald-600 hover:text-white transition-all">
                    <span>Set Available</span> <i class="fas fa-chevron-right text-xs"></i>
                </a>
                <a id="occuLink" href="#" class="flex items-center justify-between bg-red-50 text-red-700 p-5 rounded-2xl font-black hover:bg-red-600 hover:text-white transition-all">
                    <span>Set Occupied</span> <i class="fas fa-chevron-right text-xs"></i>
                </a>
                <a id="bookLink" href="#" class="flex items-center justify-between bg-amber-50 text-amber-700 p-5 rounded-2xl font-black hover:bg-amber-600 hover:text-white transition-all">
                    <span>Set Booked</span> <i class="fas fa-chevron-right text-xs"></i>
                </a>
                <a id="disabledLink" href="#" class="flex items-center justify-between bg-slate-100 text-slate-700 p-5 rounded-2xl font-black hover:bg-slate-800 hover:text-white transition-all">
                    <span>Set Disabled</span> <i class="fas fa-chevron-right text-xs"></i>
                </a>

                <div class="pt-6 border-t border-slate-100 flex flex-col items-center">
                    <a id="deleteLink" href="#" class="text-slate-400 font-bold py-2 text-xs hover:text-red-600" onclick="return confirm('Permanently delete this table?')">
                        <i class="fas fa-trash-alt"></i> Remove Table
                    </a>
                    <button onclick="closeModal()" class="mt-6 w-full py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-xs uppercase">Dismiss</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Real-time WebSocket Logic
        const socket = new SockJS('/ws-pos');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/table-updates', function (message) {
                if (message.body === "REFRESH") {
                    window.location.reload();
                    return;
                }
                const data = JSON.parse(message.body);
                if (data.action === "DELETE") {
                    const card = document.getElementById('table-card-' + data.id);
                    if (card) {
                        card.style.transform = "scale(0.5)";
                        card.style.opacity = "0";
                        setTimeout(() => card.remove(), 400);
                    }
                } else if (data.action === "UPDATE_STATUS") {
                    updateTableUI(data.id, data.status);
                } else if (data.action === "ADD") {
                    window.location.reload();
                }
            });
        });

        function updateTableUI(id, status) {
            const card = document.getElementById('table-card-' + id);
            if (!card) return;
            const badge = card.querySelector('.status-badge');
            if (badge) badge.innerText = status;

            // Updated to include 'table-disabled'
            card.classList.remove('table-available', 'table-occupied', 'table-booked', 'table-maintenance', 'table-disabled');
            card.classList.add('table-' + status.toLowerCase());
        }

        // Modal Controls
        function openAddTableModal() {
            const modal = document.getElementById('addTableModal');
            const content = document.getElementById('addTableContent');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('opacity-100'); content.classList.add('scale-100'); }, 10);
        }

        function closeAddTableModal() {
            const modal = document.getElementById('addTableModal');
            const content = document.getElementById('addTableContent');
            modal.classList.remove('opacity-100'); content.classList.remove('scale-100');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function openTableModal(el) {
            const maskedId = el.getAttribute('data-id');
            const num = el.getAttribute('data-number');
            const maskedAreaId = /*[[${maskedAreaId}]]*/ '';
            const modal = document.getElementById('tableModal');
            const content = document.getElementById('modalContent');
            document.getElementById('modalTitle').innerText = num;
            const base = "/admin/tables/" + maskedId;

            // Set href for all status links including Disabled
            document.getElementById('availLink').href = base + "/update-status/Available/" + maskedAreaId;
            document.getElementById('occuLink').href = base + "/update-status/Occupied/" + maskedAreaId;
            document.getElementById('bookLink').href = base + "/update-status/Booked/" + maskedAreaId;
            document.getElementById('disabledLink').href = base + "/update-status/Disabled/" + maskedAreaId;
            document.getElementById('deleteLink').href = base + "/delete/" + maskedAreaId;

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('opacity-100'); content.classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('tableModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-100'); content.classList.remove('scale-100');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        // Alert auto-hide logic
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.js-alert').forEach(alert => {
                setTimeout(() => {
                    alert.classList.add('fade-out-up');
                    setTimeout(() => alert.remove(), 700);
                }, 4000);
            });
        });

        // Sidebar Toggle logic
        const toggleBtn = document.getElementById('sidebarToggle');
        const wrapper = document.getElementById('mainWrapper');

        toggleBtn.addEventListener('click', () => {
            wrapper.classList.toggle('sidebar-hidden');
        });
    </script>
</body>
</html>
