<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Dashboard | Premium POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .cashier-gradient {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .order-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-color: #00f2fe;
        }
        .action-btn {
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .pdf-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        .pdf-btn:hover {
            background: linear-gradient(135deg, #ee5a24 0%, #ff6b6b 100%);
        }
    </style>
</head>
<body class="text-slate-800">
    <div class="min-h-screen p-6">
        <!-- Header -->
        <div class="max-w-7xl mx-auto">
            <div class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-2xl p-8 mb-8">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl cashier-gradient flex items-center justify-center text-white text-2xl font-black shadow-lg">
                            <i class="fas fa-cash-register"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-3 py-1 bg-gradient-to-r from-blue-500 to-cyan-500 text-white text-xs font-black uppercase rounded-full">Cashier Station</span>
                                <span class="px-2 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-lg">Active</span>
                            </div>
                            <h1 class="text-4xl font-black bg-gradient-to-r from-blue-600 to-cyan-600 bg-clip-text text-transparent">Payment Dashboard</h1>
                            <p class="text-slate-600 mt-1">Manage order checkout and generate receipts</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="loadBoard()" class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-bold hover:from-indigo-600 hover:to-purple-700 transition-all shadow-lg">
                            <i class="fas fa-sync-alt mr-2"></i> Refresh
                        </button>
                        <a th:href="@{/logout}" class="px-6 py-3 bg-gradient-to-r from-red-500 to-pink-500 text-white rounded-xl font-bold hover:from-red-600 hover:to-pink-600 transition-all shadow-lg">
                            <i class="fas fa-sign-out-alt mr-2"></i> Logout
                        </a>
                    </div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-amber-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-amber-600 text-sm font-bold uppercase">Pending</p>
                            <p class="text-3xl font-black text-amber-700" id="pendingCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-clock text-amber-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-blue-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-600 text-sm font-bold uppercase">Ready</p>
                            <p class="text-3xl font-black text-blue-700" id="readyCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-check-circle text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-emerald-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-emerald-600 text-sm font-bold uppercase">Checkout</p>
                            <p class="text-3xl font-black text-emerald-700" id="checkoutCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-dollar-sign text-emerald-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-purple-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-purple-600 text-sm font-bold uppercase">Revenue</p>
                            <p class="text-3xl font-black text-purple-700" id="revenueCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Orders Queue -->
            <div class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-2xl p-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-black text-slate-800">
                        <i class="fas fa-receipt text-blue-500 mr-3"></i>
                        Order Management
                    </h2>
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 bg-slate-100 rounded-lg text-sm font-semibold text-slate-600">
                            <i class="fas fa-filter mr-1"></i> All Orders
                        </span>
                    </div>
                </div>
                <div id="board" class="space-y-4">
                    <div class="text-center py-12">
                        <i class="fas fa-spinner fa-spin text-4xl text-slate-300 mb-4"></i>
                        <p class="text-slate-500 font-semibold">Loading orders...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function badgeClass(status) {
            if (status === 'Pending') return 'bg-gradient-to-r from-amber-400 to-orange-500 text-white border-amber-300 shadow-lg';
            if (status === 'Checkout') return 'bg-gradient-to-r from-emerald-400 to-green-500 text-white border-emerald-300 shadow-lg';
            return 'bg-gradient-to-r from-slate-400 to-gray-500 text-white border-slate-300 shadow-lg';
        }

        function itemBadgeClass(status) {
            if (status === 'Pending') return 'bg-amber-100 text-amber-700 border-amber-200';
            if (status === 'Accepted') return 'bg-blue-100 text-blue-700 border-blue-200';
            if (status === 'Cooked') return 'bg-indigo-100 text-indigo-700 border-indigo-200';
            if (status === 'Served') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
            if (status === 'Paid') return 'bg-purple-100 text-purple-700 border-purple-200';
            return 'bg-slate-100 text-slate-700 border-slate-200';
        }

        function itemLabel(status) {
            if (status === 'Pending') return 'Created';
            if (status === 'Accepted') return 'Approved';
            if (status === 'Cooked') return 'Cooked';
            if (status === 'Served') return 'Reserved';
            if (status === 'Paid') return 'Paid';
            return status;
        }

        function getStatusIcon(status) {
            if (status === 'Pending') return '<i class="fas fa-clock"></i>';
            if (status === 'Accepted') return '<i class="fas fa-fire"></i>';
            if (status === 'Cooked') return '<i class="fas fa-check-circle"></i>';
            if (status === 'Served') return '<i class="fas fa-tray"></i>';
            if (status === 'Paid') return '<i class="fas fa-dollar-sign"></i>';
            if (status === 'Checkout') return '<i class="fas fa-cash-register"></i>';
            return '<i class="fas fa-question"></i>';
        }

        async function loadBoard() {
            const root = document.getElementById('board');
            root.innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-spinner fa-spin text-4xl text-slate-300 mb-4"></i>
                    <p class="text-slate-500 font-semibold">Loading orders...</p>
                </div>
            `;
            
            try {
                const res = await fetch('/cashier/orders');
                const orders = await res.json();
                
                // Update stats
                const pending = orders.filter(o => o.order_status === 'Pending').length;
                const ready = orders.filter(o => {
                    const items = o.items || [];
                    return o.order_status === 'Pending' && items.length > 0 && items.every(i => i.item_status === 'Served');
                }).length;
                const checkout = orders.filter(o => o.order_status === 'Checkout').length;
                const revenue = orders.reduce((sum, o) => sum + (Number(o.total_amount) || 0), 0);
                
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('readyCount').textContent = ready;
                document.getElementById('checkoutCount').textContent = checkout;
                document.getElementById('revenueCount').textContent = revenue.toLocaleString();
                
                if (!orders.length) {
                    root.innerHTML = `
                        <div class="text-center py-16">
                            <div class="w-24 h-24 bg-gradient-to-r from-blue-400 to-cyan-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                                <i class="fas fa-receipt text-white text-4xl"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 mb-2">No Orders Yet</h3>
                            <p class="text-slate-600">No orders found in the system.</p>
                            <p class="text-sm text-slate-500 mt-2">New orders will appear here automatically.</p>
                        </div>
                    `;
                    return;
                }
                
                root.innerHTML = orders.map(o => {
                    const items = o.items || [];
                    const hasItems = items.length > 0;
                    const allReserved = hasItems && items.every(i => i.item_status === 'Served');
                    const canCheckout = o.order_status === 'Pending' && allReserved;
    
                    const itemRows = items.map(i => {
                        const noteDisplay = i.note ? `<div class="mt-1 p-1 bg-amber-50 border border-amber-200 rounded text-xs text-amber-800">
                            <i class="fas fa-sticky-note mr-1"></i>${i.note}
                        </div>` : '';
                        
                        return `
                            <div class="p-3 bg-gradient-to-r from-slate-50 to-slate-100 rounded-xl border border-slate-200">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1">
                                            <h4 class="text-sm font-black text-slate-800">${i.menu_name}</h4>
                                            <span class="px-2 py-1 bg-slate-800 text-white text-xs font-bold rounded-full">x${i.quantity}</span>
                                        </div>
                                        <div class="flex items-center gap-3 text-xs text-slate-600 mb-1">
                                            <span><i class="fas fa-tag mr-1"></i>${Number(i.unit_price || 0).toLocaleString()} MMK each</span>
                                            <span><i class="fas fa-calculator mr-1"></i>${Number(i.total || 0).toLocaleString()} MMK</span>
                                        </div>
                                        <span class="px-2 py-1 text-xs font-bold border ${itemBadgeClass(i.item_status)} rounded-lg">
                                            ${getStatusIcon(i.item_status)} ${itemLabel(i.item_status)}
                                        </span>
                                        ${noteDisplay}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
    
                    return `
                        <div class="order-card bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                            <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-4">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                                            <i class="fas fa-receipt text-white"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-xl font-black text-white">Order #${o.order_id}</h3>
                                            <p class="text-slate-300 text-sm">Table ${o.table_number} • ${o.waiter_name || 'Unknown'}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs text-slate-400 uppercase tracking-widest">Total</p>
                                        <p class="text-2xl font-black text-white">${Number(o.total_amount || 0).toLocaleString()} MMK</p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6">
                                <div class="mb-4">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="px-3 py-1 bg-gradient-to-r ${badgeClass(o.order_status)} text-white text-sm font-bold rounded-xl">
                                            ${getStatusIcon(o.order_status)} ${o.order_status}
                                        </span>
                                        <div class="flex items-center gap-2">
                                            ${o.order_status === 'Checkout'
                                                ? `<button onclick="exportPdf(${o.order_id})" class="pdf-btn px-4 py-2 text-white text-xs font-bold rounded-xl shadow-lg">
                                                    <i class="fas fa-file-pdf mr-1"></i> PDF
                                                </button>`
                                                : ''}
                                            ${canCheckout
                                                ? `<button onclick="checkoutOrder(${o.order_id})" class="action-btn px-4 py-2 bg-gradient-to-r from-emerald-500 to-green-600 text-white text-xs font-bold rounded-xl shadow-lg">
                                                    <i class="fas fa-cash-register mr-1"></i> Checkout
                                                </button>`
                                                : o.order_status === 'Checkout'
                                                    ? '<span class="px-3 py-2 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-xl">Already Checked Out</span>'
                                                    : '<span class="px-3 py-2 bg-slate-100 text-slate-400 text-xs font-bold rounded-xl">Waiting for all items to be Reserved</span>'}
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-2">
                                    ${itemRows || '<div class="text-center py-4 text-slate-400 text-sm">No items in this order</div>'}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error loading cashier board:', error);
                root.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                        <p class="text-red-600 font-semibold">Failed to load orders. Please refresh.</p>
                    </div>
                `;
            }
        }

        async function checkoutOrder(id) {
            try {
                const res = await fetch(`/cashier/orders/${id}/checkout`, { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Order Checked Out!',
                        text: 'Order has been moved to checkout successfully.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Cannot Checkout',
                        text: result.message || 'Failed to checkout order.'
                    });
                }
                loadBoard();
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Network Error',
                    text: 'Please check your connection and try again.'
                });
            }
        }

        async function exportPdf(orderId) {
            try {
                Swal.fire({
                    title: 'Generating PDF...',
                    html: 'Please wait while we generate your receipt.',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                const response = await fetch(`/cashier/orders/${orderId}/pdf`);
                
                if (!response.ok) {
                    throw new Error('PDF generation failed');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `order_${orderId}_receipt.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
                
                Swal.close();
                
                Swal.fire({
                    icon: 'success',
                    title: 'PDF Generated!',
                    text: 'Order receipt has been downloaded.',
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch (error) {
                Swal.close();
                console.error('PDF generation error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'PDF Generation Failed',
                    text: 'Unable to generate PDF. Please check server logs.'
                });
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(loadBoard, 30000);
        
        // Initial load
        loadBoard();
    </script>
</body>
</html>
