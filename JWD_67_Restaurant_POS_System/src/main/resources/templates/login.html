<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restaurant POS Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .login-card { background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%); }
    </style>
</head>

<body class="bg-[#F1F5F9] flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md px-8">
        <div class="login-card p-10 rounded-[2.5rem] shadow-2xl border border-white">

            <h2 class="text-3xl font-black text-center text-slate-800 mb-2">Restaurant POS</h2>
            <p class="text-center text-slate-500 mb-8 text-sm">Sign in to continue</p>

            <div th:if="${error}"
                 class="bg-red-50 border border-red-200 text-red-600 text-sm p-3 rounded-xl mb-6 text-center"
                 th:text="${error}">
            </div>

            <form th:action="@{/login}" th:object="${user}" method="post" class="space-y-6">
    <div>
        <label class="text-sm font-bold text-slate-700 ml-1">Email Address</label>
        <div class="relative mt-1">
            <input type="email" th:field="*{email}" placeholder="" required
                   class="w-full p-4 rounded-2xl border border-slate-200 bg-white/50 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all font-medium"/>
        </div>
        <p class="text-red-500 text-xs mt-1 font-semibold" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div>
        <div class="flex justify-between items-center ml-1">
            <label class="text-sm font-bold text-slate-700">Password</label>
        </div>
        <div class="relative mt-1">
            <input type="password" th:field="*{password}" placeholder="" required
                   class="w-full p-4 rounded-2xl border border-slate-200 bg-white/50 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all font-medium"/>
        </div>
        <p class="text-red-500 text-xs mt-1 font-semibold" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>

    <button type="submit"
            class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-all uppercase tracking-widest text-sm">
        Sign In
    </button>
</form>
        </div>
    </div>
</body>
</html>
