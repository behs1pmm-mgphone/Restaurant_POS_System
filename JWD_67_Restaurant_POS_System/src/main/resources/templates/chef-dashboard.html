<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Dashboard | Premium POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .chef-gradient {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .kitchen-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .kitchen-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-color: #f5576c;
        }
        .status-badge {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .action-btn {
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="text-slate-800">
    <div class="min-h-screen p-6">
        <!-- Header -->
        <div class="max-w-7xl mx-auto">
            <div class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-2xl p-8 mb-8">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl chef-gradient flex items-center justify-center text-white text-2xl font-black shadow-lg">
                            <i class="fas fa-utensils"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-3 py-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs font-black uppercase rounded-full">Chef Station</span>
                                <span class="px-2 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-lg">Active</span>
                            </div>
                            <h1 class="text-4xl font-black bg-gradient-to-r from-pink-600 to-rose-600 bg-clip-text text-transparent">Kitchen Dashboard</h1>
                            <p class="text-slate-600 mt-1">Kitchen View - Order Management Station</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="loadBoard()" class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-bold hover:from-indigo-600 hover:to-purple-700 transition-all shadow-lg">
                            <i class="fas fa-sync-alt mr-2"></i> Refresh
                        </button>
                        <a th:href="@{/logout}" class="px-6 py-3 bg-gradient-to-r from-red-500 to-pink-500 text-white rounded-xl font-bold hover:from-red-600 hover:to-pink-600 transition-all shadow-lg">
                            <i class="fas fa-sign-out-alt mr-2"></i> Logout
                        </a>
                    </div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-amber-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-amber-600 text-sm font-bold uppercase">Pending</p>
                            <p class="text-3xl font-black text-amber-700" id="pendingCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-clock text-amber-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-blue-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-600 text-sm font-bold uppercase">In Progress</p>
                            <p class="text-3xl font-black text-blue-700" id="acceptedCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-fire text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-indigo-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-indigo-600 text-sm font-bold uppercase">Ready</p>
                            <p class="text-3xl font-black text-indigo-700" id="cookedCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-check-circle text-indigo-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 backdrop-blur-lg rounded-2xl p-6 shadow-lg border border-emerald-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-emerald-600 text-sm font-bold uppercase">Total Today</p>
                            <p class="text-3xl font-black text-emerald-700" id="totalCount">0</p>
                        </div>
                        <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-chart-line text-emerald-600 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kitchen Queue -->
            <div class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-2xl p-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-black text-slate-800">
                        <i class="fas fa-fire-flame-curved text-orange-500 mr-3"></i>
                        Kitchen Queue
                    </h2>
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 bg-slate-100 rounded-lg text-sm font-semibold text-slate-600">
                            <i class="fas fa-filter mr-1"></i> Active Orders Only
                        </span>
                    </div>
                </div>
                <div id="board" class="space-y-4">
                    <div class="text-center py-12">
                        <i class="fas fa-spinner fa-spin text-4xl text-slate-300 mb-4"></i>
                        <p class="text-slate-500 font-semibold">Loading kitchen orders...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function badgeClass(status) {
            if (status === 'Pending') return 'bg-gradient-to-r from-amber-400 to-orange-500 text-white border-amber-300 shadow-lg';
            if (status === 'Accepted') return 'bg-gradient-to-r from-blue-400 to-indigo-500 text-white border-blue-300 shadow-lg';
            if (status === 'Cooked') return 'bg-gradient-to-r from-indigo-400 to-purple-500 text-white border-indigo-300 shadow-lg';
            if (status === 'Served') return 'bg-gradient-to-r from-emerald-400 to-green-500 text-white border-emerald-300 shadow-lg';
            if (status === 'Paid') return 'bg-gradient-to-r from-green-400 to-emerald-500 text-white border-green-300 shadow-lg';
            return 'bg-gradient-to-r from-slate-400 to-gray-500 text-white border-slate-300 shadow-lg';
        }

        function getStatusIcon(status) {
            if (status === 'Pending') return '<i class="fas fa-clock"></i>';
            if (status === 'Accepted') return '<i class="fas fa-fire"></i>';
            if (status === 'Cooked') return '<i class="fas fa-check-circle"></i>';
            if (status === 'Served') return '<i class="fas fa-tray"></i>';
            if (status === 'Paid') return '<i class="fas fa-dollar-sign"></i>';
            return '<i class="fas fa-question"></i>';
        }

        async function loadBoard() {
            const root = document.getElementById('board');
            root.innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-spinner fa-spin text-4xl text-slate-300 mb-4"></i>
                    <p class="text-slate-500 font-semibold">Loading kitchen orders...</p>
                </div>
            `;
            
            try {
                const res = await fetch('/chef/order-items');
                const items = await res.json();
                const visible = items.filter(i => i.item_status === 'Pending' || i.item_status === 'Accepted');
                
                // Update stats
                const pending = items.filter(i => i.item_status === 'Pending').length;
                const accepted = items.filter(i => i.item_status === 'Accepted').length;
                const cooked = items.filter(i => i.item_status === 'Cooked').length;
                const total = items.length;
                
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('acceptedCount').textContent = accepted;
                document.getElementById('cookedCount').textContent = cooked;
                document.getElementById('totalCount').textContent = total;
                
                if (!visible.length) {
                    root.innerHTML = `
                        <div class="text-center py-16">
                            <div class="w-24 h-24 bg-gradient-to-r from-emerald-400 to-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                                <i class="fas fa-check text-white text-4xl"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 mb-2">All Caught Up!</h3>
                            <p class="text-slate-600">No orders waiting for chef action right now.</p>
                            <p class="text-sm text-slate-500 mt-2">New orders will appear here automatically.</p>
                        </div>
                    `;
                    return;
                }
                
                // Group by order
                const orders = {};
                visible.forEach(item => {
                    if (!orders[item.order_id]) {
                        orders[item.order_id] = {
                            order_id: item.order_id,
                            table_number: item.table_number,
                            items: []
                        };
                    }
                    orders[item.order_id].items.push(item);
                });
                
                root.innerHTML = Object.values(orders).map(order => {
                    const orderItems = order.items.map(item => {
                        const noteDisplay = item.note ? `<div class="mt-2 p-2 bg-amber-50 border border-amber-200 rounded-lg">
                            <p class="text-xs font-semibold text-amber-800">
                                <i class="fas fa-sticky-note mr-1"></i>Note: ${item.note}
                            </p>
                        </div>` : '';
                        
                        return `
                            <div class="p-4 bg-gradient-to-r from-slate-50 to-slate-100 rounded-xl border border-slate-200">
                                <div class="flex items-start justify-between gap-4">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-3 mb-2">
                                            <h4 class="text-lg font-black text-slate-800">${item.menu_name}</h4>
                                            <span class="px-3 py-1 bg-slate-800 text-white text-sm font-bold rounded-full">x${item.quantity}</span>
                                        </div>
                                        <div class="flex items-center gap-4 text-sm text-slate-600">
                                            <span><i class="fas fa-tag mr-1"></i>${Number(item.unit_price || 0).toLocaleString()} MMK each</span>
                                            <span><i class="fas fa-calculator mr-1"></i>Total: ${Number(item.total || 0).toLocaleString()} MMK</span>
                                        </div>
                                        ${noteDisplay}
                                    </div>
                                    <div class="flex flex-col items-center gap-2">
                                        <span class="status-badge px-4 py-2 rounded-xl text-sm font-bold border ${badgeClass(item.item_status)}">
                                            ${getStatusIcon(item.item_status)} ${item.item_status}
                                        </span>
                                        ${item.item_status === 'Pending' ? `
                                            <button onclick="acceptItem(${item.order_item_id})" class="action-btn px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl font-bold shadow-lg hover:from-blue-600 hover:to-indigo-700">
                                                <i class="fas fa-check-circle mr-2"></i>Accept
                                            </button>
                                        ` : ''}
                                        ${item.item_status === 'Accepted' ? `
                                            <button onclick="cookItem(${item.order_item_id})" class="action-btn px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-bold shadow-lg hover:from-indigo-600 hover:to-purple-700">
                                                <i class="fas fa-fire mr-2"></i>Mark Cooked
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    return `
                        <div class="kitchen-card bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                            <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-4">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                                            <i class="fas fa-receipt text-white"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-xl font-black text-white">Order #${order.order_id}</h3>
                                            <p class="text-slate-300 text-sm">Table ${order.table_number}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs text-slate-400 uppercase tracking-widest">Items</p>
                                        <p class="text-2xl font-black text-white">${order.items.length}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6 space-y-3">
                                ${orderItems}
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error loading kitchen board:', error);
                root.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                        <p class="text-red-600 font-semibold">Failed to load orders. Please refresh.</p>
                    </div>
                `;
            }
        }

        async function acceptItem(id) {
            try {
                const res = await fetch(`/chef/order-items/${id}/accept`, { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Order Accepted!',
                        text: 'Item is now in progress.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Cannot Accept',
                        text: result.message || 'Failed to accept item.'
                    });
                }
                loadBoard();
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Network Error',
                    text: 'Please check your connection and try again.'
                });
            }
        }

        async function cookItem(id) {
            try {
                const res = await fetch(`/chef/order-items/${id}/cook`, { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Order Ready!',
                        text: 'Item is marked as cooked and ready for serving.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Cannot Mark as Cooked',
                        text: result.message || 'Failed to update item status.'
                    });
                }
                loadBoard();
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Network Error',
                    text: 'Please check your connection and try again.'
                });
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(loadBoard, 30000);
        
        // Initial load
        loadBoard();
    </script>
</body>
</html>
